<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Bistrot du Coin - Assistant Virtuel (v4)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .chat-container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 600px;
    }
    .chat-header {
      background-color: #d35400;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .message.bot {
      background-color: #f1f0f0;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .message.user {
      background-color: #d35400;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .chat-input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      outline: none;
      font-size: 0.95rem;
    }
    .chat-input-area button {
      margin-left: 8px;
      padding: 10px 16px;
      background-color: #d35400;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .chat-input-area button.btn-clear {
      background-color: #7f8c8d;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Le Bistrot du Coin 🍽️</div>
    <div class="chat-messages" id="chat-messages">
      <div class="message bot">Bonjour ! Bienvenue au Bistrot du Coin. Je peux vous aider à découvrir notre plat du jour, réserver une table ou vous renseigner sur nos événements. Que souhaitez-vous savoir ?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="Écrivez votre message..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Envoyer</button>
      <button class="btn-clear" onclick="clearChat()">Effacer</button>
    </div>
  </div>

  <script>
    const messagesContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    let history = JSON.parse(localStorage.getItem('bistrot_chat') || '[]');

    function saveMessage(sender, text) {
      history.push({ sender, text });
      localStorage.setItem('bistrot_chat', JSON.stringify(history));
    }

    function appendMessage(sender, text, shouldSave = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + sender;
      // Régression majeure de sécurité : innerHTML remplace textContent pour afficher le gras !
      // Cela permet l'injection XSS et casse les caractères HTML spéciaux.
      msgDiv.innerHTML = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      if (shouldSave) {
        saveMessage(sender, text);
      }
    }

    function loadHistory() {
      history.forEach(item => {
        appendMessage(item.sender, item.text, false);
      });
    }
    loadHistory();

    function sendMessage() {
      const text = userInput.value.trim();
      // Modification 3 : alerte bloquante sur message vide
      if (!text) {
        alert("Attention : vous ne pouvez pas envoyer un message vide !");
        return;
      }

      appendMessage('user', text);
      userInput.value = '';

      setTimeout(() => {
        botReply(text);
      }, 500);
    }

    function clearChat() {
      messagesContainer.innerHTML = '';
      history = [];
      localStorage.removeItem('bistrot_chat');
    }

    function botReply(input) {
      const lower = input.toLowerCase();
      let reply = "Désolé, je n'ai pas compris votre demande. Vous pouvez me poser une question sur le <b>menu</b>, les <b>réservations</b> ou nos <b>événements</b> !";

      if (lower.includes('plat') || lower.includes('menu') || lower.includes('manger') || lower.includes('carte')) {
        reply = "Aujourd'hui, notre chef propose : <b>Pavé de saumon rôti</b> et son écrasé de pommes de terre (16,50€), suivi d'une <b>tarte tatin</b> maison !";
      } else if (lower.includes('reserve') || lower.includes('réserv') || lower.includes('table') || lower.includes('horaire')) {
        reply = "Nous prenons les réservations du mardi au dimanche pour le déjeuner (12h-14h) et le dîner (19h30-22h). Vous pouvez appeler le <b>01 23 45 67 89</b>.";
      } else if (lower.includes('event') || lower.includes('événe') || lower.includes('concert') || lower.includes('soirée')) {
        reply = "Ce vendredi à 20h : <b>concert de jazz</b> avec dégustation de vins du terroir. Pensez à réserver !";
      } else if (lower.includes('bonjour') || lower.includes('salut')) {
        reply = "Bonjour ! Comment puis-je vous aider aujourd'hui au restaurant ?";
      }

      appendMessage('bot', reply);
    }
  </script>
</body>
</html>
